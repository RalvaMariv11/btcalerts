name: Monitor Bursatil Telegram

on:
  schedule:
    # Corre de lunes a viernes en horario de mercado (UTC)
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  vigilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: |
          pip install requests yfinance

      - name: Ejecutar script de alertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python preliminar.py
