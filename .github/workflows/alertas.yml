name: Monitor Bursatil Telegram

on:
  schedule:
    # Lunes a viernes en horario de mercado (UTC)
    - cron: '*/5 13-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write  # Permite guardar el estado.json de vuelta en el repo

jobs:
  vigilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: |
          pip install requests yfinance

      - name: Ejecutar script de alertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python preliminar.py

      - name: Guardar estado si hubo alertas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f estado.json ]; then
            git add estado.json
            git commit -m "Auto-update: Alerta registrada en estado.json [skip ci]" || exit 0
            git push
          fi
